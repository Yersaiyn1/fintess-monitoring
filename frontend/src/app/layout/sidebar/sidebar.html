<aside class="sidebar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" rx="9" fill="#19b58a"/><path d="M6 16h5l3-7 4 12 3-5h3" fill="none" stroke="#101a1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="name">Pulse</span>
    <button type="button" class="close" aria-label="Close menu" (click)="closeRequested.emit()">
      <app-icon name="close" [size]="20" />
    </button>
  </div>

  <nav aria-label="Main navigation">
    @for (item of items; track item.path) {
      <a class="link" [routerLink]="item.path" routerLinkActive="active" (click)="navigated.emit()">
        <app-icon [name]="item.icon" [size]="20" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <p class="foot">Fitness Monitoring · v0.1</p>
</aside>
