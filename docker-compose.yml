services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitness_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_MIGRATION_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fitness}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fitness}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      SEED_DB: ${SEED_DB:-false}
    volumes:
      - ./database:/database:ro
    networks:
      - fitness_net
    command: >
      sh -c "python -m alembic upgrade head &&
             python scripts/configure_db_roles.py &&
             if [ \"$$SEED_DB\" = \"true\" ]; then
               python -c \"import asyncio, asyncpg, os, pathlib;
               url = os.environ['DATABASE_MIGRATION_URL'].replace('postgresql+asyncpg://', 'postgresql://');
               sql = pathlib.Path('/database/seed.sql').read_text(encoding='utf-8');
               async def run():
                   c = await asyncpg.connect(url);
                   await c.execute(sql);
                   await c.close();
               asyncio.run(run())\";
             fi"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-fitness}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    ports:
      - "8000:8000"
    networks:
      - fitness_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:4200"
    networks:
      - fitness_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4200/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

networks:
  fitness_net:
    driver: bridge

volumes:
  postgres_data:
